<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    style="
      background-image: url(https://www.elegantthemes.com/blog/wp-content/uploads/2013/09/bg-2-full.jpg);
    "
  >
    <div
      class="container px-4"
      style="
        background-image: url(https://th.bing.com/th/id/OIP.xhy_X9W9XuEwoimL5mytSQHaEK?w=271&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        border: 1px solid white;
        width: 60%;
        margin: auto;
        margin-top: 3%;
        padding: 3%;
      "
    >
      <div class="row gx-5">
        <div class="col">
          <div
            class="p-3"
            style="
              background-position: center;
              background-repeat: no-repeat;
              background-size: cover;
              background-image: url(https://th.bing.com/th/id/OIP.xhy_X9W9XuEwoimL5mytSQHaEK?w=271&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7);
              color: white;
            "
          >
            <h1>Your ToDo Website</h1>
            <h2>Keep It Up</h2>
          </div>
        </div>
        <div class="col">
          <div
            class="p-3"
            id="counter"
            style="
              border-radius: 100%;
              width: 200px;
              height: 200px;
              margin: auto;
              align-content: center;
              background-color: rgb(69, 103, 144);
              font-size: 25px;
            "
          >
            Total Task = 0
          </div>
        </div>
      </div>
    </div>

    <div
      class="container px-4"
      style="
        background-image: url(https://th.bing.com/th/id/OIP.Sa2U1V75qOwz8UppkuYCbAHaE3?w=268&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7);
        background-position: center;
        background-repeat: no-repeat;
        background-size: cover;
        width: 60%;
        margin: auto;
        margin-top: 2%;
        padding: 2%;
      "
    >
      <h1 style="color: aliceblue">Add Your Task Here</h1>
      <div class="row">
        <div class="col-md-8">
          <input
            type="text"
            required
            class="w-100"
            style="
              border-radius: 0px;
              background-color: rgb(255, 255, 255);
              padding-left: 20px;
            "
            id="t1"
            placeholder="Enter your task"
          />
        </div>
        <div class="col-md-4">
          <button
            class="btn btn-primary"
            type="submit"
            style="background-color: rgb(69, 103, 144)"
            onclick="addTask()"
          >
            Add
          </button>
        </div>
      </div>

      <div style="color: rgb(255, 255, 255)" id="d1"></div>
    </div>

    <script>
      let i = 0;
      let mainParaent = document.getElementById("d1");

      function addTask() {
        i++;
        document.getElementById("counter").innerHTML = "Total Task = " + i;
        document.getElementById("counter").style.fontSize = "25px";
        let taskMsg = document.getElementById("t1").value;

        //Create a para element
        let p = document.createElement("p");
        p.innerHTML = taskMsg;
        // Create button
        let del = document.createElement("button");
        del.innerHTML = "Delete";
        del.setAttribute("onclick", "removeTask()");
        //create datee time checkbox
        var newDate = document.createElement("input");
        newDate.setAttribute("type", "datetime-local");

        p.appendChild(newDate);
        p.appendChild(del);
        mainParaent.appendChild(p);

        //document.getElementById("d1").style.backgroundColor = "green";
        document.getElementById("d1").style.backgroundImage =
          "url('https://th.bing.com/th/id/OIP.xhy_X9W9XuEwoimL5mytSQHaEK?w=271&h=180&c=7&r=0&o=5&dpr=1.3&pid=1.7')";
      }
      function removeTask() {
        i--;

        document.getElementById("counter").innerHTML = "Total Task = " + i;
        // document.getElementById("").style.backgroundColor = "red";

        event.target.parentElement.remove();
      }
    </script>
  </body>
</html>
